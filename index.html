<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitație Nuntă - Temă Marină</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --nisip: #FFFAF5;
            --marina: #001F3F;
            --azur: #0074D9;
            --text: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--nisip);
            color: var(--text);
            text-align: center;
            line-height: 1.6;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .simbol-ancora { font-size: 3rem; color: var(--azur); margin-bottom: 20px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--marina);
            margin: 10px 0;
            font-weight: 600;
            text-transform: uppercase;
        }

        .sectiune { max-width: 600px; margin: 80px auto; padding: 0 30px; }
        
        h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--marina); margin-bottom: 30px; font-style: italic; }

        /* Stil Butoane Waze */
        .btn-waze {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background-color: #33ccff;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-waze:hover { background-color: var(--azur); }

        .formular-rsvp { background-color: white; padding: 80px 20px; border-top: 1px solid rgba(0,0,0,0.05); }
        .container-form { max-width: 450px; margin: 0 auto; text-align: left; }

        label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; color: var(--marina); text-transform: uppercase; margin-top: 15px; }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 0;
            font-family: inherit;
            box-sizing: border-box;
            background: #fdfdfd;
        }

        .hidden-field { display: none; padding-left: 15px; border-left: 2px solid var(--azur); margin-bottom: 20px; }

        .btn-trimite {
            background-color: var(--marina);
            color: white;
            padding: 18px 40px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 30px;
        }

        /* Timer Styles */
        #timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .time-box {
            background: var(--marina);
            color: white;
            padding: 15px;
            min-width: 70px;
            border-radius: 5px;
        }
        .time-box span { display: block; font-size: 1.5rem; font-weight: bold; }
        .time-box label { font-size: 0.7rem; color: var(--nisip); margin: 0; }

        footer { padding: 80px 50px; background: var(--nisip); }
    </style>
</head>
<body>

    <header>
        <div class="simbol-ancora">⚓</div>
        <h1 id="numeMiri">ANDREI & MARIA</h1>
        <p style="letter-spacing: 3px;" id="dataText">22 AUGUST 2026</p>
    </header>

    <div class="sectiune">
        <h2>Locații</h2>
        <p>Vă așteptăm cu drag să ne fiți alături!</p>
        <a id="linkWazeBiserica" href="#" class="btn-waze" target="_blank">📍 WAZE: BISERICĂ</a>
        <a id="linkWazeRestaurant" href="#" class="btn-waze" target="_blank">📍 WAZE: RESTAURANT</a>
    </div>

    <div class="formular-rsvp" id="rsvp">
        <div class="container-form">
            <h2 style="text-align: center;">Confirmare</h2>
            
            <form action="https://formspree.io/f/xbdqgdae" method="POST">
                
                <label>Numele tău complet</label>
                <input type="text" name="Nume_Principal" placeholder="Introduceți numele" required>

                <label>Vei fi alături de noi?</label>
                <select name="Prezenta" id="prezenta" required onchange="toggleForm()">
                    <option value="" disabled selected>Alege o opțiune</option>
                    <option value="Singur">Vin singur(ă)</option>
                    <option value="Insotit">Vin însoțit(ă)</option>
                    <option value="Nu">Din păcate, nu pot veni</option>
                </select>

                <div id="divPartener" class="hidden-field">
                    <label>Numele partenerului/însoțitorului</label>
                    <input type="text" name="Nume_Partener" placeholder="Introduceți numele partenerului">
                </div>

                <div id="detaliiSuplimentare" class="hidden-field">
                    <label>Vii cu copii?</label>
                    <select name="Are_Copii" id="areCopii" onchange="toggleCopii()">
                        <option value="Nu">Nu</option>
                        <option value="Da">Da</option>
                    </select>

                    <div id="numarCopiiDiv" class="hidden-field">
                        <label>Câți copii vă însoțesc?</label>
                        <input type="number" name="Numar_Copii" min="1" placeholder="Ex: 1">
                    </div>

                    <label>Opțiune Meniu</label>
                    <select name="Meniu" id="meniu" onchange="toggleMeniu()">
                        <option value="Normal">Meniu Normal</option>
                        <option value="Vegan">Meniu Vegan/Vegetarian</option>
                        <option value="Altul">Altă opțiune (alergii/restricții)</option>
                    </select>

                    <div id="detaliiMeniuDiv" class="hidden-field">
                        <label>Detalii meniu special:</label>
                        <textarea name="Detalii_Meniu" placeholder="Vă rugăm să ne comunicați opțiunea sau restricțiile..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-trimite">Trimite Confirmarea</button>
            </form>
        </div>
    </div>

    <footer>
        <h2>Până la eveniment au mai rămas:</h2>
        <div id="timer">
            <div class="time-box"><span id="days">00</span><label>ZILE</label></div>
            <div class="time-box"><span id="hours">00</span><label>ORE</label></div>
            <div class="time-box"><span id="minutes">00</span><label>MIN</label></div>
        </div>
        <p style="margin-top: 50px;" id="footerNume">ANDREI & MARIA — 2026</p>
    </footer>

    <script>
        // --- DATE EDITABILE ---
        const config = {
            miri: "Andrei & Maria",
            dataNunta: "22 August 2026 16:30:00", // Format: Luna Zi An Ora:Min:Sec
            dataAfisata: "Sâmbătă, 22 August 2026",
            // Coordonate Waze (le iei din app: Share -> Copy Link)
            wazeBiserica: "https://www.waze.com/ul?ll=44.4377,26.1154&navigate=yes",
            wazeRestaurant: "https://www.waze.com/ul?ll=44.4444,26.1111&navigate=yes"
        };

        // Aplicare date
        document.getElementById('numeMiri').innerText = config.miri;
        document.getElementById('dataText').innerText = config.dataAfisata;
        document.getElementById('footerNume').innerText = config.miri + " — 2026";
        document.getElementById('linkWazeBiserica').href = config.wazeBiserica;
        document.getElementById('linkWazeRestaurant').href = config.wazeRestaurant;

        // Logica Formular
        function toggleForm() {
            const prezenta = document.getElementById('prezenta').value;
            const divPartener = document.getElementById('divPartener');
            const detalii = document.getElementById('detaliiSuplimentare');
            
            divPartener.style.display = (prezenta === 'Insotit') ? 'block' : 'none';
            detalii.style.display = (prezenta === 'Singur' || prezenta === 'Insotit') ? 'block' : 'none';
        }

        function toggleCopii() {
            const areCopii = document.getElementById('areCopii').value;
            document.getElementById('numarCopiiDiv').style.display = (areCopii === 'Da') ? 'block' : 'none';
        }

        function toggleMeniu() {
            const meniu = document.getElementById('meniu').value;
            document.getElementById('detaliiMeniuDiv').style.display = (meniu === 'Altul') ? 'block' : 'none';
        }

        // Countdown Timer
        const countdown = () => {
            const countDate = new Date(config.dataNunta).getTime();
            const now = new Date().getTime();
            const gap = countDate - now;

            if (gap > 0) {
                const second = 1000;
                const minute = second * 60;
                const hour = minute * 60;
                const day = hour * 24;

                document.getElementById('days').innerText = Math.floor(gap / day);
                document.getElementById('hours').innerText = Math.floor((gap % day) / hour);
                document.getElementById('minutes').innerText = Math.floor((gap % hour) / minute);
            }
        };
        setInterval(countdown, 1000);
        countdown();
    </script>
</body>
</html>
