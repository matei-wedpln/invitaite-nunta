<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitație Nuntă - Temă Marină</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --nisip: #FFFAF5;
            --marina: #001F3F;
            --azur: #0074D9;
            --text: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--nisip);
            color: var(--text);
            text-align: center;
            line-height: 1.6;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .simbol-ancora { font-size: 3rem; color: var(--azur); margin-bottom: 20px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--marina);
            margin: 10px 0;
            font-weight: 600;
            text-transform: uppercase;
        }

        .sectiune { max-width: 600px; margin: 100px auto; padding: 0 30px; }
        
        h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--marina); margin-bottom: 40px; font-style: italic; }

        .formular-rsvp { background-color: white; padding: 80px 20px; border-top: 1px solid rgba(0,0,0,0.05); }

        .container-form { max-width: 450px; margin: 0 auto; text-align: left; /* Aliniere text label-uri */ }

        label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; color: var(--marina); text-transform: uppercase; }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 0;
            font-family: inherit;
            box-sizing: border-box;
            background: #fdfdfd;
        }

        /* Ascundem câmpurile condiționate la început */
        .hidden-field { display: none; }

        .btn-trimite {
            background-color: var(--marina);
            color: white;
            padding: 18px 40px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-trimite:hover { background-color: var(--azur); }

        footer { padding: 50px; opacity: 0.6; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="simbol-ancora">⚓</div>
        <h1 id="numeMiri">ANDREI & MARIA</h1>
        <p style="letter-spacing: 3px;" id="dataNunta">22 AUGUST 2026</p>
    </header>

    <div class="formular-rsvp" id="rsvp">
        <div class="container-form">
            <h2 style="text-align: center;">Confirmare</h2>
            
            <form action="https://formspree.io/f/xbdqgdae" method="POST">
                
                <label>Nume complet</label>
                <input type="text" name="Nume" placeholder="Introduceți numele" required>

                <label>Vei fi alături de noi?</label>
                <select name="Prezenta" id="prezenta" required onchange="togglePrezenta()">
                    <option value="" disabled selected>Alege o opțiune</option>
                    <option value="Singur">Vin singur(ă)</option>
                    <option value="Insotit">Vin însoțit(ă)</option>
                    <option value="Nu">Din păcate, nu pot veni</option>
                </select>

                <div id="sectiuneCopii" class="hidden-field">
                    <label>Vii cu copii?</label>
                    <select name="Are_Copii" id="areCopii" onchange="toggleCopii()">
                        <option value="Nu">Nu</option>
                        <option value="Da">Da</option>
                    </select>

                    <div id="numarCopiiDiv" class="hidden-field">
                        <label>Câți copii te însoțesc?</label>
                        <input type="number" name="Numar_Copii" min="1" placeholder="Ex: 2">
                    </div>
                </div>

                <div id="sectiuneMeniu" class="hidden-field">
                    <label>Opțiune Meniu</label>
                    <select name="Meniu" id="meniu" onchange="toggleMeniu()">
                        <option value="Normal">Meniu Normal</option>
                        <option value="Vegan">Meniu Vegan/Vegetarian</option>
                        <option value="Altul">Altă opțiune (alergii/restricții)</option>
                    </select>

                    <div id="detaliiMeniuDiv" class="hidden-field">
                        <label>Vă rugăm să ne comunicați opțiunea:</label>
                        <textarea name="Detalii_Meniu" placeholder="Detalii despre restricții sau preferințe..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-trimite">Trimite Confirmarea</button>
            </form>
        </div>
    </div>

    <footer>
        <p id="footerNume">ANDREI & MARIA — 2026</p>
    </footer>

    <script>
        function togglePrezenta() {
            const prezenta = document.getElementById('prezenta').value;
            const sectiuneCopii = document.getElementById('sectiuneCopii');
            const sectiuneMeniu = document.getElementById('sectiuneMeniu');
            
            if (prezenta === 'Singur' || prezenta === 'Insotit') {
                sectiuneCopii.style.display = 'block';
                sectiuneMeniu.style.display = 'block';
            } else {
                sectiuneCopii.style.display = 'none';
                sectiuneMeniu.style.display = 'none';
            }
        }

        function toggleCopii() {
            const areCopii = document.getElementById('areCopii').value;
            const numarCopiiDiv = document.getElementById('numarCopiiDiv');
            numarCopiiDiv.style.display = (areCopii === 'Da') ? 'block' : 'none';
        }

        function toggleMeniu() {
            const meniu = document.getElementById('meniu').value;
            const detaliiMeniuDiv = document.getElementById('detaliiMeniuDiv');
            detaliiMeniuDiv.style.display = (meniu === 'Altul') ? 'block' : 'none';
        }

        // Date Editabile
        const date = {
            miri: "Andrei & Maria",
            data: "Sâmbătă, 22 August 2026"
        };
        document.getElementById('numeMiri').innerText = date.miri;
        document.getElementById('dataNunta').innerText = date.data;
        document.getElementById('footerNume').innerText = date.miri + " — 2026";
    </script>
</body>
</html>
